<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Loading...</title>

  <link rel="icon" href="/favicon.svg" />

  <script>
    (async function () {
      try {
        const response = await fetch(
          "https://ngo-demo-3.onrender.com/api/settings"
        );

        const result = await response.json();

        if (result.success && result.data) {
          // Site Name
          if (result.data.siteName) {
            document.title = result.data.siteName;
          }

          // Favicon
          if (result.data.favicon) {
            let favicon = document.querySelector("link[rel='icon']");

            if (!favicon) {
              favicon = document.createElement("link");
              favicon.rel = "icon";
              document.head.appendChild(favicon);
            }

            favicon.href =
              "https://ngo-demo-3.onrender.com" + result.data.favicon;
          }
        }
      } catch (error) {
        console.error("Failed to load settings:", error);

        document.title = "Parsippany Lions Club1";
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
  if ('loading' in HTMLImageElement.prototype) {
    const images = document.querySelectorAll('img[loading="lazy"]');
    images.forEach(img => {
      img.src = img.dataset.src;
    });
  } else {
    // Dynamically import the LazySizes library
    const script = document.createElement('script');
    script.src =
      'https://cdnjs.cloudflare.com/ajax/libs/lazysizes/5.1.2/lazysizes.min.js';
    document.body.appendChild(script);
  }
</script>
</body>

</html>
